<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo App - Simple & Powerful</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script defer="defer" src="main.js"></script></head><body><div id="app"><header><h1><i class="fas fa-tasks"></i> Todo SimpleApp</h1><p>Your minimalist task manager</p></header><main><div class="container"><aside id="sidebar" class="sidebar"><h3><i class="fas fa-folder"></i> Projects</h3><ul id="projects-list"></ul><button id="new-project-btn" class="btn"><i class="fas fa-plus"></i> New Project</button></aside><section class="content"><div id="project-header"><div id="current-project">Inbox</div><button id="new-todo-btn" class="btn primary"><i class="fas fa-plus"></i> Add Todo</button></div><div id="todos-container"><p>Your todos will appear here...</p></div></section></div></main><div id="todo-modal" class="modal" style="display:none"><div class="modal-content"><div class="modal-header"><h2>Add New Todo</h2><button class="close-modal">&times;</button></div><form id="todo-form"><div class="form-group"><label for="todo-title">Title *</label> <input id="todo-title" required placeholder="What needs to be done?"></div><div class="form-group"><label for="todo-description">Description</label> <textarea id="todo-description" rows="3" placeholder="Additional details (optional)"></textarea></div><div class="form-row"><div class="form-group"><label for="todo-due-date">Due Date</label> <input type="date" id="todo-due-date"></div><div class="form-group"><label for="todo-priority">Priority</label> <select id="todo-priority"><option value="low">Low</option><option value="medium" selected="selected">Medium</option><option value="high">High</option></select></div></div><div class="form-actions"><button type="button" class="btn cancel-btn">Cancel</button> <button type="submit" class="btn primary">Add Todo</button></div></form></div></div><footer><p>Built with ❤️ using Webpack & localStorage</p></footer></div></body></html>
