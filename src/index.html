<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo SimpleApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fas fa-tasks"></i> Todo SimpleApp</h1>
            <p class="subtitle">A clean, modern todo app with drag & drop</p>
        </header>
        
        <div class="app-content">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>Projects</h3>
                    <button id="new-project-btn" class="icon-btn" title="New Project">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div id="projects-list"></div>
            </aside>
            
            <main>
                <section class="content">
                    <div id="current-project"></div>
                    
                    <div class="todos-header">
                        <h3>Todos</h3>
                        <button id="new-todo-btn" class="btn primary">
                            <i class="fas fa-plus"></i> New Todo
                        </button>
                    </div>
                    
                    <div id="todos-container"></div>
                </section>
            </main>
        </div>
        
        <!-- Todo Modal -->
        <div id="todo-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add New Todo</h2>
                    <button class="close-modal">&times;</button>
                </div>
                
                <form id="todo-form">
                    <div class="form-group">
                        <label for="todo-title">Title *</label>
                        <input type="text" id="todo-title" required placeholder="What needs to be done?">
                    </div>
                    
                    <div class="form-group">
                        <label for="todo-description">Description</label>
                        <textarea id="todo-description" rows="3" placeholder="Additional details (optional)"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="todo-due-date">Due Date</label>
                            <input type="date" id="todo-due-date">
                        </div>
                        
                        <div class="form-group">
                            <label for="todo-priority">Priority</label>
                            <select id="todo-priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- RECURRENCE FIELDS -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="todo-recurrence">Repeat</label>
                            <select id="todo-recurrence">
                                <option value="none" selected>Does not repeat</option>
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                                <option value="yearly">Yearly</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="todo-recurrence-end">End Date (optional)</label>
                            <input type="date" id="todo-recurrence-end">
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn cancel-btn">Cancel</button>
                        <button type="submit" class="btn primary">Add Todo</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Project Modal -->
        <div id="project-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>New Project</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <form id="project-form">
                    <div class="form-group">
                        <label for="project-name">Project Name *</label>
                        <input type="text" id="project-name" required placeholder="e.g., Work, Personal">
                    </div>
                    <div class="form-group">
                        <label for="project-description">Description (optional)</label>
                        <textarea id="project-description" rows="2" placeholder="What's this project about?"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn cancel-btn">Cancel</button>
                        <button type="submit" class="btn primary">Create Project</button>
                    </div>
                </form>
            </div>
        </div>
        
        <footer>
            <p>Built with ❤️ using Webpack & localStorage</p>
        </footer>
    </div>
</body>
</html>
